name: Crawl wedding data

# 매주 월요일 새벽(한국 시간 04:00)에 업체·후기·뉴스를 다시 모은다.
# 결과가 바뀌면 public/data에 커밋하고, 그 커밋이 배포 워크플로를 깨운다.
on:
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node crawler/run.mjs
      - name: Commit data
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "주간 데이터 갱신 $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

  # GITHUB_TOKEN으로 한 push는 다른 워크플로를 깨우지 않아서 여기서 배포를 직접 부른다
  deploy:
    needs: crawl
    if: needs.crawl.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
